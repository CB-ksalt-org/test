apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: rerun-chain
on:
  workflow_dispatch:
jobs:
  job-a:
    outputs:
      greeting: ${{ steps.produce.outputs.greeting }}
    steps:
      - name: Produce output
        id: produce
        uses: docker://alpine:3.20
        shell: sh
        run: |
          echo "job-a running"
          printf "hello-from-a" > "$CLOUDBEES_OUTPUTS/greeting"
  job-b:
    needs: job-a
    steps:
      - name: Use output of job-a
        uses: docker://alpine:3.20
        shell: sh
        run: |
          echo "job-b got: ${{ needs.job-a.outputs.greeting }}"
  job-c:
    needs: job-b
    steps:
      - name: Final step
        uses: docker://alpine:3.20
        shell: sh
        run: echo "job-c running"
