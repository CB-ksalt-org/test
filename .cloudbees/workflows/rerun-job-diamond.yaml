apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: rerun-job-diamond
on:
  workflow_dispatch:
jobs:
  job-a:
    steps:
      - name: Run job-a
        uses: docker://alpine:3.20
        shell: sh
        run: echo "job-a running"
  job-b:
    steps:
      - name: Run job-b
        uses: docker://alpine:3.20
        shell: sh
        run: echo "job-b failing" && exit 1
  job-c:
    needs: [job-a, job-b]
    steps:
      - name: Run job-c
        uses: docker://alpine:3.20
        shell: sh
        run: echo "job-c running"
  job-d:
    needs: job-c
    steps:
      - name: Run job-d
        uses: docker://alpine:3.20
        shell: sh
        run: echo "job-d running"
